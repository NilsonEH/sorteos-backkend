<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de sorteos</title>
<style>
  :root { --bg:#1a1233; --card:#241a45; --line:#3a2d66; --text:#f4f0ff; --muted:#b9aee0; --gold:#f5c542; --coral:#ef6b63; --green:#25d366; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); padding:20px 16px 40px; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { color:var(--gold); font-size:26px; margin:0 0 4px; }
  h2 { font-size:18px; margin:0 0 12px; }
  .muted { color:var(--muted); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:16px; }
  input { width:100%; padding:14px; border-radius:12px; border:1px solid var(--line); background:#130d27; color:var(--text); font-size:16px; margin-bottom:10px; }
  button { width:100%; padding:14px; border:0; border-radius:12px; background:var(--coral); color:#1a1233; font-weight:700; font-size:16px; }
  button.secondary { background:transparent; color:var(--muted); border:1px solid var(--line); }
  button:disabled { opacity:.5; }
  .stats { display:flex; gap:8px; margin-top:10px; }
  .stat { flex:1; background:#130d27; border-radius:12px; padding:12px 6px; text-align:center; }
  .stat b { display:block; font-size:22px; color:var(--gold); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row small { color:var(--muted); display:block; word-break:break-all; }
  .pill { background:#130d27; color:var(--gold); border-radius:999px; padding:4px 10px; font-weight:700; white-space:nowrap; }
  .winner { text-align:center; padding:16px; border:2px solid var(--gold); border-radius:16px; margin-top:12px; }
  .winner b { color:var(--gold); font-size:22px; display:block; margin:6px 0; }
  .wa { display:inline-block; margin-top:12px; background:var(--green); color:#0b2e17; font-weight:700; padding:12px 18px; border-radius:12px; text-decoration:none; }
  .error { color:var(--coral); font-size:14px; min-height:18px; margin:0 0 8px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Panel de sorteos 🎉</h1>
  <p class="muted">Solo para administración</p>

  <div id="login" class="card">
    <h2>Ingresar</h2>
    <input id="keyInput" type="password" placeholder="Tu clave de administrador">
    <p id="loginError" class="error"></p>
    <button id="loginBtn">Entrar</button>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <p class="muted" id="nextDraw"></p>
      <div class="stats">
        <div class="stat"><b id="statPeople">0</b><span class="muted">Participantes</span></div>
        <div class="stat"><b id="statTickets">0</b><span class="muted">Boletos</span></div>
        <div class="stat"><b id="statAmount">S/ 0</b><span class="muted">Recaudado</span></div>
      </div>
    </div>

    <div class="card">
      <h2>Realizar sorteo</h2>
      <input id="prizeInput" placeholder="Premio (ej. Audífonos Bluetooth)">
      <p id="drawError" class="error"></p>
      <button id="drawBtn">Sortear ahora</button>
      <div id="winnerBox"></div>
    </div>

    <div class="card">
      <h2>Participantes del próximo sorteo</h2>
      <div id="peopleList" class="muted">Cargando...</div>
    </div>

    <div class="card">
      <h2>Historial</h2>
      <div id="historyList" class="muted">Cargando...</div>
    </div>

    <div class="card">
      <button id="refreshBtn" class="secondary">Actualizar</button>
      <div style="height:10px"></div>
      <button id="logoutBtn" class="secondary">Cerrar sesión</button>
    </div>
  </div>
</div>

<script>
(() => {
  let adminKey = sessionStorage.getItem('adminKey') || '';
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fecha = d => d ? new Date(d).toLocaleString('es-PE', { dateStyle:'medium', timeStyle:'short' }) : '';
  const soles = c => 'S/ ' + (c / 100).toFixed(2);
  const waLink = (phone, text) => 'https://wa.me/51' + String(phone || '').replace(/\D/g, '') + '?text=' + encodeURIComponent(text);

  (function showNextDraw() {
    const lima = new Date(Date.now() - 5 * 3600e3);
    let add = (6 - lima.getUTCDay() + 7) % 7;
    if (add === 0 && lima.getUTCHours() >= 20) add = 7;
    const d = new Date(Date.UTC(lima.getUTCFullYear(), lima.getUTCMonth(), lima.getUTCDate() + add));
    $('nextDraw').textContent = 'Próximo sorteo: sábado ' + d.getUTCDate() + '/' + (d.getUTCMonth() + 1) + ', 8:00 p.m.';
  })();

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const err = new Error(data.error || 'Error'); err.status = res.status; throw err; }
    return data;
  }

  async function login() {
    adminKey = $('keyInput').value.trim();
    $('loginError').textContent = '';
    $('loginBtn').disabled = true;
    $('loginBtn').textContent = 'Verificando...';
    try {
      await loadPeople();
      sessionStorage.setItem('adminKey', adminKey);
      $('login').classList.add('hidden');
      $('app').classList.remove('hidden');
      loadHistory();
    } catch (e) {
      sessionStorage.removeItem('adminKey');
      $('loginError').textContent = e.status === 401 ? 'Clave incorrecta' : 'No se pudo conectar. Espera un minuto e intenta de nuevo.';
    } finally {
      $('loginBtn').disabled = false;
      $('loginBtn').textContent = 'Entrar';
    }
  }

  async function loadPeople() {
    const rows = await api('/api/subscribers');
    $('statPeople').textContent = rows.length;
    $('statTickets').textContent = rows.reduce((t, p) => t + p.tickets, 0);
    $('statAmount').textContent = soles(rows.reduce((t, p) => t + p.amount, 0));
    $('peopleList').innerHTML = rows.length
      ? rows.map(p => `
        <div class="row">
          <div><b>${esc(p.name)}</b><small>${esc(p.phone)} · ${esc(p.email)}</small></div>
          <span class="pill">${p.tickets} 🎟️</span>
        </div>`).join('')
      : 'Aún no hay boletos vendidos para este sorteo.';
  }

  async function loadHistory() {
    try {
      const rows = await api('/api/raffles');
      $('historyList').innerHTML = rows.length
        ? rows.map(r => `
          <div class="row">
            <div><b>${esc(r.prize)}</b><small>${esc(r.winner_name || 'Sin ganador')} · ${r.total_tickets ? r.total_tickets + ' boletos · ' : ''}${fecha(r.drawn_at)}</small></div>
          </div>`).join('')
        : 'Aún no hay sorteos.';
    } catch {
      $('historyList').textContent = 'No se pudo cargar el historial.';
    }
  }

  async function draw() {
    const prize = $('prizeInput').value.trim();
    $('drawError').textContent = '';
    if (!prize) { $('drawError').textContent = 'Escribe el premio primero'; return; }
    if (!confirm(`¿Sortear "${prize}" ahora? Los boletos de esta semana se cerrarán y el resultado quedará registrado.`)) return;
    $('drawBtn').disabled = true;
    $('drawBtn').textContent = 'Sorteando...';
    try {
      const r = await api('/api/raffles/draw', { method: 'POST', body: JSON.stringify({ prize }) });
      const msg = `¡Hola ${r.winner.name}! 🎉 Ganaste "${r.prize}" en nuestro sorteo semanal. Te escribimos para coordinar la entrega de tu premio.`;
      $('winnerBox').innerHTML = `
        <div class="winner">
          <span class="muted">Ganador de ${esc(r.prize)}</span>
          <b>${esc(r.winner.name)}</b>
          <span class="muted">${r.winner.tickets} de ${r.totalTickets} boletos · ${r.participants} participantes</span><br>
          <span class="muted">${esc(r.winner.phone)} · ${esc(r.winner.email)}</span><br>
          <a class="wa" href="${esc(waLink(r.winner.phone, msg))}" target="_blank" rel="noopener">Avisar por WhatsApp</a>
        </div>`;
      $('prizeInput').value = '';
      loadPeople();
      loadHistory();
    } catch (e) {
      $('drawError').textContent = e.message;
    } finally {
      $('drawBtn').disabled = false;
      $('drawBtn').textContent = 'Sortear ahora';
    }
  }

  $('loginBtn').addEventListener('click', login);
  $('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  $('drawBtn').addEventListener('click', draw);
  $('refreshBtn').addEventListener('click', () => { loadPeople().catch(() => {}); loadHistory(); });
  $('logoutBtn').addEventListener('click', () => { sessionStorage.removeItem('adminKey'); location.reload(); });

  if (adminKey) { $('keyInput').value = adminKey; login(); }
})();
</script>
</body>
</html>
